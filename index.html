<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Time!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/board.jpg">
<style>
  :root {
    --bg: #020006;
    --ink: #f4ecff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: "Chakra Petch", system-ui, sans-serif;
  }

  /* ---------- Papan (gambar asli dari desain) ---------- */
  .board {
    position: relative;
    width: min(100vw, 200vh);
    aspect-ratio: 2 / 1;
    background: url("assets/board.jpg") center / 100% 100% no-repeat;
    container-type: inline-size;
  }
  .cell {
    position: absolute;
    width: 10.4%; height: 9.6%;
    transform: translate(-50%, -50%);
    border: 0; padding: 0; margin: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 0.2cqw;
    transition: box-shadow .18s ease, background-color .18s ease, transform .18s ease;
  }
  .cell:hover, .cell:focus-visible {
    outline: none;
    background: color-mix(in srgb, var(--c) 14%, transparent);
    box-shadow: 0 0 1.2cqw var(--c), inset 0 0 1cqw color-mix(in srgb, var(--c) 60%, transparent);
    transform: translate(-50%, -50%) scale(1.03);
  }
  /* Kotak yang sudah dipakai: angka ditutup, bingkai tetap terlihat */
  .cell.used::after {
    content: "";
    position: absolute; inset: 8% 5%;
    background: #03000a;
    border-radius: 0.2cqw;
  }
  .cell.used { cursor: default; }
  .cell.used:hover { background: transparent; box-shadow: none; transform: translate(-50%, -50%); }

  /* ---------- Tombol kecil (pojok bawah) ---------- */
  /* Logo SU di atas papan = tombol reset quiz */
  .logo-reset {
    position: absolute;
    left: 51.46%; top: 5.47%;
    width: 3.1%; height: 5.4%;
    transform: translate(-50%, -50%);
    border: 0; padding: 0; background: transparent;
    border-radius: 0.6cqw;
    cursor: pointer;
    transition: box-shadow .18s ease;
  }
  .logo-reset:hover, .logo-reset:focus-visible {
    outline: none;
    box-shadow: 0 0 1cqw rgba(170, 120, 255, .8);
  }
  .tools {
    position: fixed; right: 10px; bottom: 10px;
    display: flex; gap: 6px; opacity: 0; transition: opacity .2s;
    z-index: 5;
  }
  .tools:hover, .tools:focus-within { opacity: 1; }
  .tools button {
    font: 10px "Press Start 2P", monospace; color: #cfc2ff;
    background: rgba(20, 8, 40, .85); border: 1px solid #6b4bff;
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .tools button:hover { color: #fff; box-shadow: 0 0 10px #6b4bff; }

  /* ---------- Layar soal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    padding: 3vmin;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(110, 40, 255, .35), transparent 60%),
      linear-gradient(rgba(255, 70, 220, .07) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(80, 140, 255, .07) 1px, transparent 1px) 0 0 / 40px 40px,
      rgba(2, 0, 8, .94);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .card {
    position: relative;
    width: min(92vw, 1500px);
    max-height: 92vh;
    display: flex; flex-direction: column;
    border: 3px solid var(--c);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(14, 4, 30, .96), rgba(4, 0, 12, .96));
    box-shadow: 0 0 28px color-mix(in srgb, var(--c) 70%, transparent),
                inset 0 0 40px color-mix(in srgb, var(--c) 18%, transparent);
    transform: scale(.85); transition: transform .3s cubic-bezier(.2, 1.4, .4, 1);
    overflow: hidden;
  }
  .modal.open .card { transform: scale(1); }
  .head {
    display: flex; align-items: center; justify-content: space-between; gap: 2vw;
    padding: clamp(14px, 2.2vh, 28px) clamp(18px, 2.6vw, 44px);
    border-bottom: 2px solid color-mix(in srgb, var(--c) 55%, transparent);
  }
  .cat {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(12px, 1.5vw, 26px);
    color: var(--c);
    text-shadow: 0 0 10px var(--c);
    line-height: 1.5;
  }
  .meta { display: flex; align-items: center; gap: 1.2vw; flex-shrink: 0; }
  .val {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(18px, 2.4vw, 44px);
    color: var(--c); text-shadow: 0 0 14px var(--c);
  }
  .lvl {
    font-family: "Press Start 2P", monospace; font-size: clamp(9px, .9vw, 15px);
    padding: .7em 1em; border-radius: 999px;
    border: 2px solid currentColor;
  }
  .lvl.Mudah { color: #5dffa8; }
  .lvl.Sedang { color: #ffd84d; }
  .lvl.Sulit { color: #ff5c8a; }
  .body {
    padding: clamp(20px, 4vh, 56px) clamp(18px, 3.4vw, 64px);
    overflow: auto;
  }
  .q {
    margin: 0;
    font-size: clamp(22px, 3.1vw, 58px);
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    text-shadow: 0 0 12px rgba(190, 150, 255, .45);
  }
  .q p { margin: 0 0 .5em; }
  .q p:last-child { margin-bottom: 0; }
  .q.long { font-size: clamp(18px, 2.3vw, 42px); }
  pre {
    margin: clamp(14px, 3vh, 36px) auto 0;
    width: fit-content; max-width: 100%;
    padding: clamp(12px, 2vh, 26px) clamp(16px, 2vw, 34px);
    font: 500 clamp(13px, 1.55vw, 28px) / 1.45 "JetBrains Mono", Consolas, monospace;
    color: #d9f7ff;
    background: rgba(0, 0, 0, .55);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    border-left: 4px solid var(--c);
    border-radius: 8px;
    overflow: auto;
    text-align: left;
  }
  pre.big { font-size: clamp(12px, 1.25vw, 23px); }
  .close {
    position: absolute; top: 10px; right: 12px;
    width: 40px; height: 40px; display: none;
  }
  .foot {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    padding: 0 0 clamp(14px, 2.4vh, 30px);
  }
  .btn {
    font: clamp(10px, .85vw, 14px) "Press Start 2P", monospace;
    color: var(--c); background: transparent;
    border: 2px solid var(--c); border-radius: 8px;
    padding: 1em 1.6em; cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .btn:hover, .btn:focus-visible { outline: none; background: var(--c); color: #0a0016; box-shadow: 0 0 16px var(--c); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<main class="board" id="board" aria-label="Papan Quiz Jeopardy">
  <button class="logo-reset" id="logoReset" title="Reset quiz" aria-label="Reset quiz: munculkan lagi semua poin"></button>
</main>

<div class="tools">
  <button id="btnFull" title="Layar penuh (F)">LAYAR PENUH</button>
  <button id="btnReset" title="Buka lagi semua kotak">RESET PAPAN</button>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mCat">
  <div class="card" id="card">
    <div class="head">
      <div class="cat" id="mCat"></div>
      <div class="meta">
        <span class="lvl" id="mLvl"></span>
        <span class="val" id="mVal"></span>
      </div>
    </div>
    <div class="body">
      <div class="q" id="mQ"></div>
      <pre id="mCode" hidden></pre>
    </div>
    <div class="foot">
      <button class="btn" id="btnKembali" title="Tutup soal, poin hilang dari papan (Esc)">KEMBALI KE PAPAN</button>
    </div>
  </div>
</div>

<script src="soal.js"></script>
<script>
(function () {
  // Posisi tengah tiap kotak di gambar papan (dalam %), urut kolom lalu $100..$500
  const POS = [
    [[14.97,36.58],[15.02,48.30],[15.02,59.54],[14.99,71.79],[14.84,83.66]],
    [[26.19,36.62],[26.22,47.93],[26.25,60.14],[26.14,71.48],[26.19,83.46]],
    [[37.74,36.54],[37.76,48.31],[37.71,60.36],[37.80,71.61],[37.76,83.62]],
    [[49.01,36.58],[49.13,48.37],[49.16,60.36],[49.28,71.45],[49.33,83.60]],
    [[60.59,36.77],[60.57,48.15],[60.47,59.85],[60.49,71.75],[60.44,83.37]],
    [[71.93,36.30],[71.82,48.26],[72.05,60.04],[72.05,71.07],[71.95,83.35]],
    [[83.42,36.49],[83.45,48.10],[83.60,60.04],[83.42,71.75],[83.42,83.51]],
  ];
  // Warna neon mengikuti gradasi di papan (pink kiri-atas -> hijau kanan-bawah)
  const GRAD = ["#ff4fe0","#d95cff","#a86bff","#7f7dff","#5f95ff","#4cb4ff","#45d8f0","#4cf0c0","#7cf59a","#b4f56e","#d8f25a"];
  const colorFor = (c, r) => GRAD[Math.min(GRAD.length - 1, c + r)];

  // Kotak yang poinnya sudah hilang disimpan di browser, jadi tetap hilang setelah reload.
  // Tombol RESET PAPAN mengosongkan catatan ini.
  const KEY = "quiz-jeopardy-used-v2";
  let used = new Set();
  try { used = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...used])); } catch (e) {} };

  const board = document.getElementById("board");
  const modal = document.getElementById("modal");
  const card = document.getElementById("card");
  const mCat = document.getElementById("mCat");
  const mVal = document.getElementById("mVal");
  const mLvl = document.getElementById("mLvl");
  const mQ = document.getElementById("mQ");
  const mCode = document.getElementById("mCode");
  let current = null, lastBtn = null;

  window.SOAL.forEach((kat, c) => {
    kat.soal.forEach((s, r) => {
      const id = c + "-" + r;
      const b = document.createElement("button");
      b.className = "cell" + (used.has(id) ? " used" : "");
      b.style.left = POS[c][r][0] + "%";
      b.style.top = POS[c][r][1] + "%";
      b.style.setProperty("--c", colorFor(c, r));
      b.dataset.id = id;
      b.setAttribute("aria-label", kat.kategori + " $" + s.poin);
      b.addEventListener("click", () => { if (!b.classList.contains("used")) open(c, r, b); });
      board.appendChild(b);
    });
  });

  function open(c, r, btn) {
    const kat = window.SOAL[c], s = kat.soal[r];
    current = c + "-" + r; lastBtn = btn;
    card.style.setProperty("--c", colorFor(c, r));
    mCat.textContent = kat.kategori;
    mVal.textContent = "$" + s.poin;
    mLvl.textContent = s.level.toUpperCase();
    mLvl.className = "lvl " + s.level;
    mQ.innerHTML = "";
    s.teks.split("\n").forEach(line => {
      const p = document.createElement("p"); p.textContent = line; mQ.appendChild(p);
    });
    mQ.classList.toggle("long", s.teks.length > 220 || !!s.kode);
    if (s.kode) {
      mCode.textContent = s.kode; mCode.hidden = false;
      mCode.classList.toggle("big", s.kode.split("\n").length > 6);
    } else { mCode.hidden = true; }
    modal.classList.add("open");
    document.getElementById("btnKembali").focus();
  }

  // Soal terjawab atau tidak, poinnya tetap hilang dari papan.
  function close() {
    if (!current) return;
    used.add(current); save();
    if (lastBtn) { lastBtn.classList.add("used"); lastBtn.blur(); }
    modal.classList.remove("open");
    current = null;
  }

  document.getElementById("btnKembali").addEventListener("click", close);
  modal.addEventListener("click", e => { if (e.target === modal) close(); });

  function resetQuiz() {
    if (!confirm("Reset quiz? Semua poin akan muncul lagi.")) return;
    used.clear(); save();
    board.querySelectorAll(".cell").forEach(b => b.classList.remove("used"));
  }
  document.getElementById("btnReset").addEventListener("click", resetQuiz);
  document.getElementById("logoReset").addEventListener("click", e => { e.currentTarget.blur(); resetQuiz(); });
  const toggleFull = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  };
  document.getElementById("btnFull").addEventListener("click", toggleFull);

  document.addEventListener("keydown", e => {
    if (modal.classList.contains("open")) {
      if (e.key === "Escape") close();
    } else if (e.key === "f" || e.key === "F") toggleFull();
  });
})();
</script>
</body>
</html>
